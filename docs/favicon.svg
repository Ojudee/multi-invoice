<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152b" />
      <stop offset="50%" stop-color="#0b2341" />
      <stop offset="100%" stop-color="#112f56" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald / BOQ Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Indigo / Structural Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Front Sheet Drop Shadow -->
    <filter id="cardShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Outer Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradient)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="40" x2="80" y2="472" />
    <line x1="160" y1="40" x2="160" y2="472" />
    <line x1="240" y1="40" x2="240" y2="472" />
    <line x1="320" y1="40" x2="320" y2="472" />
    <line x1="400" y1="40" x2="400" y2="472" />
    <line x1="40" y1="80" x2="472" y2="80" />
    <line x1="40" y1="160" x2="472" y2="160" />
    <line x1="40" y1="240" x2="472" y2="240" />
    <line x1="40" y1="320" x2="472" y2="320" />
    <line x1="40" y1="400" x2="472" y2="400" />
  </g>

  <!-- ======================================================== -->
  <!-- MULTI-INVOICE STACK (3 DISTINCT DISCIPLINE SHEETS)       -->
  <!-- ======================================================== -->

  <!-- SHEET 1 (BACK / LEFT): Structural & Inspection Package (Indigo) -->
  <g transform="translate(90, 88) rotate(-7)">
    <rect x="0" y="0" width="220" height="290" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="4" opacity="0.85" />
    <!-- Header band -->
    <path d="M 0 14 C 0 6 6 0 14 0 L 206 0 C 214 0 220 6 220 14 L 220 48 L 0 48 Z" fill="url(#indigoGrad)" />
    <!-- Minimal lines -->
    <rect x="22" y="70" width="110" height="10" rx="5" fill="#3b82f6" opacity="0.6" />
    <rect x="22" y="96" width="176" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="22" y="116" width="160" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="22" y="136" width="140" height="6" rx="3" fill="#64748b" opacity="0.5" />
  </g>

  <!-- SHEET 2 (MIDDLE / RIGHT): BOQ Package (Emerald) -->
  <g transform="translate(200, 100) rotate(8)">
    <rect x="0" y="0" width="220" height="290" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="4" opacity="0.9" />
    <!-- Header band -->
    <path d="M 0 14 C 0 6 6 0 14 0 L 206 0 C 214 0 220 6 220 14 L 220 48 L 0 48 Z" fill="url(#emeraldGrad)" />
    <!-- BOQ tabular rows -->
    <rect x="22" y="70" width="120" height="10" rx="5" fill="#10b981" opacity="0.7" />
    <rect x="22" y="96" width="176" height="6" rx="3" fill="#475569" opacity="0.6" />
    <rect x="22" y="116" width="176" height="6" rx="3" fill="#475569" opacity="0.6" />
    <rect x="22" y="136" width="176" height="6" rx="3" fill="#475569" opacity="0.6" />
  </g>

  <!-- SHEET 3 (FRONT / PROMINENT): Primary Invoice Document -->
  <g filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect x="136" y="116" width="240" height="304" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />

    <!-- Top Golden Brand Ribbon (Univision Multi-Invoice) -->
    <path d="M 136 132 C 136 123 143 116 152 116 L 360 116 C 369 116 376 123 376 132 L 376 182 L 136 182 Z" fill="url(#goldGrad)" />

    <!-- Header Invoice Emblem -->
    <g transform="translate(156, 134)">
      <!-- Mini Document Stack Icon in Gold Bar -->
      <rect x="0" y="0" width="20" height="26" rx="3" fill="#0b2341" />
      <line x1="4" y1="6" x2="16" y2="6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
      <line x1="4" y1="12" x2="14" y2="12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
      <line x1="4" y1="18" x2="11" y2="18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
      <text x="30" y="18" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0b2341" letter-spacing="1">INVOICE</text>
    </g>

    <!-- Invoice Header Subline -->
    <rect x="156" y="198" width="90" height="10" rx="5" fill="#0b2341" opacity="0.9" />
    <rect x="316" y="198" width="44" height="10" rx="5" fill="#f59e0b" />

    <!-- Invoice Items Table Simulation -->
    <!-- Table Header -->
    <rect x="156" y="222" width="200" height="16" rx="4" fill="#f1f5f9" />
    <rect x="164" y="227" width="50" height="6" rx="3" fill="#64748b" />
    <rect x="320" y="227" width="28" height="6" rx="3" fill="#64748b" />

    <!-- Item Row 1: Architectural Drawing Scope -->
    <line x1="156" y1="248" x2="356" y2="248" stroke="#f1f5f9" stroke-width="1.5" />
    <rect x="164" y="254" width="94" height="7" rx="3.5" fill="#1e293b" />
    <rect x="310" y="254" width="38" height="7" rx="3.5" fill="#0b2341" />

    <!-- Item Row 2: Structural Engineering Scope -->
    <line x1="156" y1="271" x2="356" y2="271" stroke="#f1f5f9" stroke-width="1.5" />
    <rect x="164" y="277" width="80" height="7" rx="3.5" fill="#334155" />
    <rect x="316" y="277" width="32" height="7" rx="3.5" fill="#0b2341" />

    <!-- Item Row 3: BOQ / Inspection Scope -->
    <line x1="156" y1="294" x2="356" y2="294" stroke="#f1f5f9" stroke-width="1.5" />
    <rect x="164" y="300" width="68" height="7" rx="3.5" fill="#334155" />
    <rect x="312" y="300" width="36" height="7" rx="3.5" fill="#0b2341" />

    <!-- Total Due Highlight Box -->
    <rect x="156" y="324" width="200" height="34" rx="8" fill="#0b2341" />
    <text x="170" y="345" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">TOTAL DUE</text>
    <text x="344" y="346" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#fbbf24" text-anchor="end">D 185,000</text>

    <!-- Bottom Tear/Perforation Dots -->
    <g fill="#cbd5e1">
      <circle cx="166" cy="378" r="3" />
      <circle cx="186" cy="378" r="3" />
      <circle cx="206" cy="378" r="3" />
      <circle cx="226" cy="378" r="3" />
      <circle cx="246" cy="378" r="3" />
      <circle cx="266" cy="378" r="3" />
      <circle cx="286" cy="378" r="3" />
      <circle cx="306" cy="378" r="3" />
      <circle cx="326" cy="378" r="3" />
      <circle cx="346" cy="378" r="3" />
    </g>

    <!-- Digital Barcode Lines -->
    <g fill="#0b2341" opacity="0.8">
      <rect x="166" y="392" width="3" height="16" />
      <rect x="172" y="392" width="6" height="16" />
      <rect x="181" y="392" width="2" height="16" />
      <rect x="186" y="392" width="8" height="16" />
      <rect x="197" y="392" width="4" height="16" />
      <rect x="204" y="392" width="2" height="16" />
      <rect x="209" y="392" width="7" height="16" />
      <rect x="219" y="392" width="3" height="16" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- FLOATING GOLDEN STAMP / SEAL (Multi-Studio Official)     -->
  <!-- ======================================================== -->
  <g transform="translate(320, 320)" filter="url(#goldGlow)">
    <!-- Outer Seal Ring -->
    <circle cx="48" cy="48" r="46" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
    <circle cx="48" cy="48" r="38" fill="#0b2341" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Multi-Invoice Discipline Icons / Cross Star -->
    <!-- Center Checkmark & Sparkle -->
    <path d="M 36 48 L 44 56 L 62 38" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mini Discipline Dots -->
    <circle cx="48" cy="22" r="3" fill="#60a5fa" />
    <circle cx="48" cy="74" r="3" fill="#34d399" />
  </g>
</svg>
